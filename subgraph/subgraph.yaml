specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: Angstrom
    network: mainnet
    source:
      address: "0x0000000aa232009084bd71a5797d089aa4edfad4"
      abi: Angstrom
      startBlock: 22972937
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Bundle
        - TopOfBlockOrder
        - PoolUpdate
        - UserOrder
      abis:
        - name: Angstrom
          file: ./abis/Angstrom.json
      callHandlers:
        - function: execute(bytes)
          handler: handleExecute
      file: ./src/mapping.ts
